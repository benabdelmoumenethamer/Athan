<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011b15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#d97706" stroke-width="6"/>
  <!-- Decorative Islamic Geometric Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Minaret in background center -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Minaret Spire & Crescent -->
    <path d="M256 120 L260 160 L252 160 Z" />
    <circle cx="256" cy="115" r="4" />
    <!-- Minaret Dome & Balcony -->
    <path d="M244 185 C244 165 268 165 268 185 Z" />
    <rect x="238" y="185" width="36" height="8" rx="2" />
    <rect x="242" y="193" width="28" height="35" rx="3" />
    <rect x="236" y="228" width="40" height="8" rx="2" />
    <rect x="240" y="236" width="32" height="150" />
    <rect x="232" y="386" width="48" height="18" rx="3" />
  </g>

  <!-- Grand Golden Crescent Moon -->
  <path d="M285 140 
           A 135 135 0 1 0 350 355 
           A 115 115 0 1 1 285 140 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"/>
        
  <!-- 8-Point Islamic Star -->
  <path d="M360 175 L366 186 L378 188 L369 197 L371 209 L360 203 L349 209 L351 197 L342 188 L354 186 Z" 
        fill="#fef08a"/>
</svg>
