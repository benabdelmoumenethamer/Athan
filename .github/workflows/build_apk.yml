name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Compilation du frontend Web (génère dist/)
        run: npm run build

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Acceptation des licences Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Les 4 fichiers Adhan (public/audio) sont copiés dans res/raw : ce sont eux
      # que lisent les canaux de notification et le plugin natif AdhanAudio.
      - name: Synchronisation Capacitor et sons Adhan
        run: |
          mkdir -p android/app/src/main/res/raw
          cp -f public/audio/*.mp3 android/app/src/main/res/raw/
          npx cap sync android

      - name: Compilation de l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparation de l'APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Adhan-Algeria.apk
          ls -lh apk_output/Adhan-Algeria.apk

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Adhan-Algeria-APK
          path: apk_output/Adhan-Algeria.apk
          retention-days: 30
